<line x1="1104.525758943365" y1="401.9443588597499" x2="920.0806968006902" y2="455.2778708046197" stroke="#DDE5EE" stroke-width="4" stroke-dasharray="10 12"/>
<line x1="1050.1520386556872" y1="632.9440220889641" x2="908.5303927655574" y2="552.0173672946042" stroke="#DDE5EE" stroke-width="4" stroke-dasharray="10 12"/>
<line x1="549.8479613443128" y1="632.9440220889641" x2="691.4696072344426" y2="552.0173672946042" stroke="#DDE5EE" stroke-width="4" stroke-dasharray="10 12"/>
<line x1="495.4742410566351" y1="401.9443588597499" x2="679.9193031993098" y2="455.2778708046197" stroke="#DDE5EE" stroke-width="4" stroke-dasharray="10 12"/>
<text x="800" y="856" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="600" fill="#18324B" text-anchor="middle">The output is not just an answer—it becomes reusable, machine-checkable infrastructure.</text>
</svg>