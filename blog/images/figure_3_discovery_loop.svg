<path d="M 412 618 C 345 560, 325 470, 343 430" fill="none" stroke="#1E5AA8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 470 300 C 570 235, 680 214, 688 214" fill="none" stroke="#1E5AA8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
